name: OS64 Manual Build

on:
  workflow_dispatch:
    inputs:
      run_smoke_tests:
        description: Boot QEMU and test every installed command
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build and validate OS64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential binutils nasm grub-common grub-pc-bin xorriso \
            mtools dosfstools e2fsprogs qemu-system-x86 python3-pexpect

      - name: Build bootable images
        run: make -j2

      - name: Validate kernel and root filesystem
        run: make check-all

      - name: Validate ext2, ext3, and ext4 images
        run: make check-ext

      - name: Run command smoke tests
        if: ${{ inputs.run_smoke_tests }}
        run: make smoke-commands

      - name: Upload OS64 images
        uses: actions/upload-artifact@v4
        with:
          name: os64-1.0-x86_64
          path: |
            build/images/os64.iso
            build/images/os64-disk.img
          if-no-files-found: error
          retention-days: 14
