# OS64 Boot Manager policy. Installed as /GRUB.CFG on the boot volume.
if search --file --set=os64_panic_root /PANIC.FLG; then
    set root=$os64_panic_root
    echo "OS64 Boot Manager: previous kernel panic detected"
    echo "Starting Mini64 recovery environment..."
    multiboot2 /MINI64.BIN recovery=pstore
    module2 /KERNEL.BIN kernel
    module2 /INITRD.BIN initrd
else
    echo "OS64 Boot Manager 1.0"
    multiboot2 /KERNEL.BIN bootmode=normal
    module2 /INITRD.BIN initrd
fi
boot
