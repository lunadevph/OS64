insmod all_video
insmod gfxterm
insmod png
insmod keystatus
set gfxmode=1024x768,auto
terminal_output gfxterm
loadfont /boot/grub/themes/os64/os64-mono-14.pf2
loadfont /boot/grub/themes/os64/os64-display-30.pf2
set theme=/boot/grub/themes/os64/theme.txt
export theme

# Boot the safe normal profile immediately. This avoids firmware keyboard
# noise cancelling GRUB's countdown on VirtualBox. Hold Shift during firmware
# startup to request the full OS64 boot menu.
if keystatus --shift; then
    set timeout=-1
    set timeout_style=menu
else
    set timeout=0
    set timeout_style=hidden
fi
set default=0

menuentry "OS64 1.0" {
    # Preserve the VBE framebuffer selected above. Display services require a
    # Multiboot framebuffer; forcing text here caused a blank/crashing boot on
    # VirtualBox after GRUB successfully rendered the graphical menu.
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin bootmode=normal
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "OS64 1.0 Desktop" {
    insmod all_video
    set gfxmode=1024x768,auto
    terminal_output gfxterm
    set gfxpayload=1024x768x32
    multiboot2 /boot/kernel.bin bootmode=desktop
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "OS64 1.0 CLI Mode" {
    set gfxpayload=text
    terminal_output console
    multiboot2 /boot/kernel.bin bootmode=cli console=text
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "OS64 1.0 1920x1080 Mode" {
    insmod all_video
    set gfxmode=1920x1080,auto
    terminal_output gfxterm
    set gfxpayload=1920x1080x32
    multiboot2 /boot/kernel.bin bootmode=normal screen=large
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "OS64 1.0 1280x720 Mode" {
    insmod all_video
    set gfxmode=1280x720,auto
    terminal_output gfxterm
    set gfxpayload=1280x720x32
    multiboot2 /boot/kernel.bin bootmode=normal
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "OS64 1.0 1024x768 Mode" {
    insmod all_video
    set gfxmode=1024x768,auto
    terminal_output gfxterm
    set gfxpayload=1024x768x32
    multiboot2 /boot/kernel.bin bootmode=normal
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "OS64 1.0 Debug Mode (text)" {
    insmod all_video
    set gfxmode=auto
    terminal_output gfxterm
    set gfxpayload=text
    multiboot2 /boot/kernel.bin bootmode=debug
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "OS64 1.0 Recovery Mode (serial)" {
    set gfxpayload=text
    multiboot2 /boot/kernel.bin bootmode=recovery console=serial
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "Mini64 Rescue System" {
    set gfxpayload=text
    multiboot2 /boot/mini64/mini64.bin
    module2 /boot/kernel.bin kernel
    module2 /boot/initrd.tar initrd
    module2 /boot/os64-boot.img bootloader
    module2 /boot/os64.cfg manager
    module2 /boot/mini64/mini64.bin mini64
    boot
}
