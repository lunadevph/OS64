# OS64 Boot Manager 1.0. GRUB supplies the audited BIOS/FAT transport.
set os64_bootmode=normal
set os64_default=os64-normal
set timeout=3
set timeout_style=menu

# Fixed marker names avoid executing configuration text from the interoperable
# FAT volume. Mini64 exclusively creates these after validating bootmode input.
if [ -f /MODEDESK.FLG ]; then
    set os64_bootmode=desktop
    set os64_default=os64-desktop
elif [ -f /MODECLI.FLG ]; then
    set os64_bootmode=cli
    set os64_default=os64-cli
elif [ -f /MODEDBG.FLG ]; then
    set os64_bootmode=debug
    set os64_default=os64-debug
elif [ -f /MODERECV.FLG ]; then
    set os64_bootmode=recovery
    set os64_default=os64-recovery
fi
set default=$os64_default

# Panic recovery is one-shot because Mini64 consumes PANIC.FLG.
if [ -f /PANIC.FLG ]; then
    set default=os64-panic-recovery
    set timeout=0
    set timeout_style=hidden
fi

menuentry "OS64 1.0" --id os64-normal {
    multiboot2 /KERNEL.BIN bootmode=normal
    module2 /INITRD.BIN initrd
}
menuentry "OS64 1.0 Desktop" --id os64-desktop {
    multiboot2 /KERNEL.BIN bootmode=desktop
    module2 /INITRD.BIN initrd
}
menuentry "OS64 1.0 CLI" --id os64-cli {
    multiboot2 /KERNEL.BIN bootmode=cli console=text
    module2 /INITRD.BIN initrd
}
menuentry "OS64 1.0 Debug" --id os64-debug {
    multiboot2 /KERNEL.BIN bootmode=debug loglevel=debug
    module2 /INITRD.BIN initrd
}
menuentry "Mini64 Recovery" --id os64-recovery {
    multiboot2 /MINI64.BIN recovery=manual
    module2 /KERNEL.BIN kernel
    module2 /INITRD.BIN initrd
}
menuentry "Mini64 Automatic Panic Recovery" --id os64-panic-recovery {
    multiboot2 /MINI64.BIN recovery=pstore
    module2 /KERNEL.BIN kernel
    module2 /INITRD.BIN initrd
}
