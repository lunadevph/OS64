# Generic ABI command trampolines compiled into the initramfs.
bin=basename cat cd clear cp curl date dd dirname diskinfo display dmesg echo fill find free groups head hexdump help history host id ifconfig install-apps ip login logout ls logd mkdir mkuser mv nano nslookup ntp ofp passwd ping ps pwd rm route sh stat status su sudo sync tail time touch truncate umask uname wc who whoami xxd
sbin=acpid chkfs chmod chgrp chown diskd displayd format fsd graphicsd halt init install memoryd mount netd nologin reboot shutdown timed useradd userdel userd usermod
