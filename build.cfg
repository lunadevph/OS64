# OS64 build identity and kernel policy.
# Change these values, then run `make clean && make`.
OS_NAME=OS64
KERNEL_VERSION=1.0
OS_DESCRIPTION=Experimental Operating System
SYSTEM_POLICY=educational-secure
ARCHITECTURE=x86_64
# Boot manager: grub (direct OS64 boot) or os64 (panic-aware recovery policy).
BOOTLOADER=os64
